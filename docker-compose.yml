services:
  server:
    build:
      context: ./cpp-server
      dockerfile: Dockerfile
    # volumes:
    #   - ./servers/data:/usr/gmail-project/servers/data 
    ports:
      - "8080:8080"

  tests:
    build:
      context: ./cpp-server
      dockerfile: Dockerfile
      args:
        - BUILD_TESTING=ON
    # volumes:
    #   - ./servers/data:/usr/gmail-project/servers/data
    stdin_open: true
    tty: true
    command: [./my_tests]

  webserver: 
    build:
      context: .
      dockerfile: Dockerfile.webserver
    volumes:
      - ./servers/src/web/pictures:/usr/src/gmail-project/servers/src/web/pictures
      - ./servers/src/web/tempUploads:/usr/src/gmail-project/servers/src/web/tempUploads
    ports:
      - "3000:3000"
    stdin_open: true
    tty: true
    depends_on:
      - server
    environment:
      SERVER_HOST: server
      SERVER_PORT: 8080
    