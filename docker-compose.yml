services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    volumes:
      - ./servers/data:/usr/gmail-project/servers/data 
    ports:
      - "8080:8080"

  tests:
    build:
      context: .
      dockerfile: Dockerfile.server
      args:
        - BUILD_TESTING=ON
    volumes:
      - ./servers/data:/usr/gmail-project/servers/data
    stdin_open: true
    tty: true
    command: [./build/my_tests]

  webserver: 
    build:
      context: .
      dockerfile: Dockerfile.webserver
    volumes:
      - ./servers/pictures:/usr/src/gmail-project/servers/pictures
      - ./servers/tempUploads:/usr/src/gmail-project/servers/tempUploads
    ports:
      - "3000:3000"
    stdin_open: true
    tty: true
    depends_on:
      - server
    environment:
      SERVER_HOST: server
      SERVER_PORT: 8080
    