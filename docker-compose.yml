services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    volumes:
      - ./data:/usr/gmail-project/data 
    ports:
      - "8080:8080"

  tests:
    build:
      context: .
      dockerfile: Dockerfile.server
      args:
        - BUILD_TESTING=ON
    volumes:
      - ./data:/usr/gmail-project/data
    stdin_open: true
    tty: true
    command: [./my_tests]

  webserver: 
    build:
      context: .
      dockerfile: Dockerfile.webserver
    ports:
      - "5000:5000"
    stdin_open: true
    tty: true
    depends_on:
      - server
    environment:
      SERVER_HOST: server
      SERVER_PORT: 8080
    