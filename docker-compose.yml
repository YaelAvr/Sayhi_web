services:
  server:
    build:
      context: ./cpp-server
      dockerfile: Dockerfile
    ports:
      - "8080:8080"

  # tests:
  #   build:
  #     context: ./cpp-server
  #     dockerfile: Dockerfile
  #     args:
  #       - BUILD_TESTING=ON
  #   # volumes:
  #   #   - ./servers/data:/usr/gmail-project/servers/data
  #   stdin_open: true
  #   tty: true
  #   command: [./my_tests]

  webserver: 
    build:
      context: ./web-server
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    stdin_open: true
    tty: true
    depends_on:
      - server
      - db
    env_file:
      - .env
    networks:
        - backend


  db:
    image: mongo:latest
    container_name: db
    restart: always
    ports:
        - "27017:27017"
    volumes:
        - mongo-data:/data/db
    networks:
        - backend

  # react-app: 
