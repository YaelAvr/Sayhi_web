services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    volumes:
      - ./data:/usr/gmail-project/data 
    stdin_open: true
    tty: true
    ports:
      - "8080:8080"

  tests:
    build:
      context: .
      dockerfile: Dockerfile.server
    volumes:
      - ./data:/usr/gmail-project/data
    stdin_open: true
    tty: true
    command: [./my_tests]
  
  client: 
    build:
        context: .
        dockerfile: Dockerfile.client
    stdin_open: true
    tty: true
    depends_on:
      - server
